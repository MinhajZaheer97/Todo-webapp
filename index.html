<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="todo-card" aria-label="Todo list preview">
        <div class="header">
          <div>
            <p class="eyebrow">Today</p>
            <h1>My Tasks</h1>
          </div>
        </div>

        <form class="task-form">
          <input type="text" placeholder="Add a new task" aria-label="New task" class="input"/>
          <button type="submit" class="btn">Add</button>
        </form>


        <div class="tasks">

        </div>
        <p class="footer-note">A calm and focused space for your plans.</p>
      </section>
    </main>

  </body>
</html>
